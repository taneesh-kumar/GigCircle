spring:
  application:
    name: cooperative-gig-platform-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cooperative_gig}
    username: ${DATABASE_USERNAME:${PGUSER:postgres}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt-secret: ${JWT_SECRET:phase-one-development-secret-change-before-authentication}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

gigcircle:
  platform-fee-percentage: ${PLATFORM_FEE_PERCENTAGE:10.00}